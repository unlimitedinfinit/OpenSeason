name: Windows installer

# Builds a desktop installer as a downloadable artifact.
# Does not create a GitHub Release. Josh merges and releases after review.

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build Windows bundles
        run: npm run tauri build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openseason-windows-installer
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
